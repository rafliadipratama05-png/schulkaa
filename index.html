<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schulkaa</title>
<link href="https://fonts.googleapis.com/css2?family=Nosifer&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#050505;color:#ccc;min-height:100vh;padding-bottom:110px}
body:before{content:"";position:fixed;inset:0;background:url(bg.jpg) center/cover;z-index:-1}
.hd{text-align:center;padding:2rem 1rem 0}
h1{font-family:Nosifer,Impact,cursive;color:#f00;font-size:2.2rem;text-shadow:0 0 12px #f00}
.hd p{color:#f44;font-size:.8rem;letter-spacing:2px;margin-top:.5rem}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:1rem}
button{font:inherit;cursor:pointer;background:#1a0000;color:#f33;border:1px solid #6a0000;border-radius:4px;padding:.6rem 1rem;font-weight:700}
button:active{background:#f00;color:#fff}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;max-width:500px;margin:auto}
.c{background:rgba(10,10,10,.85);border:1px solid #2a0000;border-radius:4px;overflow:hidden}
.i{height:100px;display:flex;align-items:center;justify-content:center;font-size:2.8rem;background:#0d0000}
.i img{width:100%;height:100%;object-fit:cover}
.b{padding:.6rem}
.b h3{font-size:.85rem;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p{color:#f00;font-weight:800;margin:.2rem 0 .5rem}
.q{display:flex;align-items:center;justify-content:space-between;gap:4px}
.q button{padding:.3rem .7rem}
.bar{position:fixed;bottom:0;left:0;right:0;max-width:500px;margin:auto;background:rgba(5,0,0,.95);border-top:1px solid #4a0000;padding:.7rem 1rem;display:flex;align-items:center;gap:8px;z-index:9}
.bar b{color:#f00;display:block}
.bar .o{flex:1;background:#8b0000;color:#fff}
.m{position:fixed;inset:0;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center;padding:1rem;z-index:20}
.m.s{display:flex}
.m>div{width:100%;max-width:380px;max-height:90vh;overflow:auto;background:#0a0000;border:1px solid #8b0000;border-radius:8px;padding:1.2rem}
.m h2{color:#f00;margin-bottom:.8rem}
.m input{width:100%;padding:.6rem;margin:.3rem 0 .6rem;background:#000;border:1px solid #4a0000;color:#fff;border-radius:4px;font-size:16px}
.m>div>button{width:100%;margin-top:.4rem}
.r{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:.5rem 0;border-bottom:1px solid #1a0000;font-size:.85rem}
.fu{position:relative;overflow:hidden;padding:.9rem;margin:.3rem 0 .6rem;background:#000;border:1px dashed #8b0000;border-radius:4px;text-align:center;color:#f33;font-weight:700}
#t{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#8b0000;color:#fff;padding:.6rem 1rem;border-radius:4px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;text-align:center}
#t.s{opacity:1}
</style></head>
<body>
<div class="hd"><h1>SCHULKAA</h1><p>Order kalau berani... 🩸</p>
<div class="btns"><button data-a="login" id="bl">🔒 Admin</button><button data-a="form" id="bf" hidden>➕ Produk</button><button data-a="music" id="bm">🎵 Musik: OFF</button></div></div>
<div class="g" id="g"></div>
<div class="bar"><div><b id="n">0 item</b><span id="h">Rp 0</span></div><button data-a="cart">📜</button><button class="o" data-a="order">🩸 Order</button></div>

<div class="m" id="ml"><div><h2>🔒 Admin</h2><input type="password" id="pw" placeholder="Password"><button data-a="go">Masuk</button><button data-a="x" data-m="ml">Batal</button></div></div>

<div class="m" id="mw"><div><h2>🩸 Pilih Admin</h2><button data-a="wa" data-id="1">WhatsApp Admin 1</button><button data-a="wa" data-id="2">WhatsApp Admin 2</button><button data-a="x" data-m="mw">Batal</button></div></div>

<div class="m" id="mp"><div><h2>🩸 Produk</h2><input type="hidden" id="e"><input id="pn" placeholder="Nama produk"><input type="number" id="ph" placeholder="Harga"><div class="fu"><span id="fl">📸 Pilih Foto</span><input type="file" id="f" accept="image/*" style="position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;cursor:pointer"></div><input id="pu" placeholder="atau tempel link foto"><button data-a="sv">💾 Simpan</button><button data-a="del" id="pd">🗑️ Hapus</button><button data-a="x" data-m="mp">Batal</button></div></div>

<div class="m" id="mc"><div><h2>🩸 Keranjang</h2><div id="cl"></div><p style="margin:.8rem 0;color:#f00;font-weight:700">Total: <span id="ct">Rp 0</span></p><button data-a="order">Order via WhatsApp</button><button data-a="clr">Kosongkan</button><button data-a="x" data-m="mc">Tutup</button></div></div>

<div id="t"></div>
<script>
var KEY="$2a$10$hj0ZeC4bjxagFeBpVOAqLO.QD3GTpTflFVTB9FQmZBFHwu6OhHYEC",
BIN="6b02dfa6ffd5d16053d592fd",API="https://api.jsonbin.io/v3/b/"+BIN,
PASS="schulkaa123",WA={1:"6283119756828",2:"6287721106278"},
P=[],C={},img="",adm=false,arm=false,au=null,on=0,tm;
function $(i){return document.getElementById(i)}
function rp(n){return"Rp "+(+n).toLocaleString("id-ID")}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return"&#"+c.charCodeAt(0)+";"})}
function toast(m){var t=$("t");t.textContent=m;t.classList.add("s");clearTimeout(tm);tm=setTimeout(function(){t.classList.remove("s")},2500)}
function M(id,s){$(id).classList.toggle("s",s)}
function setAdm(){$("bl").hidden=adm;$("bf").hidden=!adm}
function tot(){var n=0,h=0;P.forEach(function(p){var q=C[p.id]||0;n+=q;h+=q*p.harga});return[n,h]}
function draw(){
 $("g").innerHTML=P.map(function(p){return'<div class="c"><div class="i">'+(p.img?'<img src="'+esc(p.img)+'">':"🩸")+'</div><div class="b"><h3>'+esc(p.nama)+'</h3><div class="p">'+rp(p.harga)+'</div><div class="q"><button data-a="st" data-id="'+p.id+'" data-d="-1">−</button><b>'+(C[p.id]||0)+'</b><button data-a="st" data-id="'+p.id+'" data-d="1">+</button>'+(adm?'<button data-a="form" data-id="'+p.id+'">✏️</button>':"")+'</div></div></div>'}).join("")||'<p style="grid-column:1/-1;text-align:center">Belum ada produk</p>';
 var t=tot();$("n").textContent=t[0]+" item";$("h").textContent=rp(t[1]);
}
function cart(){
 var h="";P.forEach(function(p){var q=C[p.id];if(q)h+='<div class="r"><span>'+esc(p.nama)+"<br>"+rp(p.harga*q)+'</span><span><button data-a="st" data-id="'+p.id+'" data-d="-1">−</button> '+q+' <button data-a="st" data-id="'+p.id+'" data-d="1">+</button></span></div>'});
 $("cl").innerHTML=h||"<p>Keranjang kosong 🩸</p>";$("ct").textContent=rp(tot()[1]);
}
function form(id){
 var p=P.find(function(x){return x.id==id});img=p&&p.img||"";arm=false;
 $("e").value=p?p.id:"";$("pn").value=p?p.nama:"";$("ph").value=p?p.harga:"";$("f").value="";$("fl").textContent="📸 Pilih Foto";$("pu").value=p&&p.img&&p.img.indexOf("data:")!=0?p.img:"";
 $("pd").hidden=!p;$("pd").textContent="🗑️ Hapus";M("mp",1);
}
$("f").onchange=function(){
 var f=this.files[0];if(!f)return;var r=new FileReader;
 r.onload=function(e){var i=new Image;
  i.onload=function(){var s=Math.min(1,240/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);img=c.toDataURL("image/jpeg",.55);$("fl").textContent="✅ Foto siap";toast("Foto siap ✓")};
  i.onerror=function(){toast("Foto tidak terbaca")};i.src=e.target.result};
 r.readAsDataURL(f);
};
function put(){
 toast("Menyimpan...");
 fetch(API,{method:"PUT",headers:{"Content-Type":"application/json","X-Master-Key":KEY},body:JSON.stringify({data:P})})
 .then(function(r){if(!r.ok)throw 0;toast("Tersimpan untuk semua orang ✓")}).catch(function(){toast("Gagal simpan. Foto terlalu besar?")});
}
function sv(){
 var n=$("pn").value.trim(),h=parseInt($("ph").value,10),id=$("e").value;
 if(!n||isNaN(h))return toast("Isi nama & harga");
 var u=$("pu").value.trim();if(u)img=u;
 if(id){var p=P.find(function(x){return x.id==id});p.nama=n;p.harga=h;if(img)p.img=img}
 else P.push({id:Date.now(),nama:n,harga:h,img:img});
 put();draw();M("mp",0);
}
function del(){
 if(!arm){arm=true;$("pd").textContent="⚠️ Klik lagi untuk yakin";return}
 var id=$("e").value;P=P.filter(function(x){return x.id!=id});delete C[id];put();draw();M("mp",0);
}
function wa(n){
 var m="Halo Schulkaa, saya mau order:\n\n",i=0;
 P.forEach(function(p){var q=C[p.id];if(q)m+=++i+". "+p.nama+" x"+q+" = "+rp(p.harga*q)+"\n"});
 m+="\nTotal: "+rp(tot()[1]);M("mw",0);
 var u="https://wa.me/"+WA[n]+"?text="+encodeURIComponent(m);window.open(u,"_blank")||(location.href=u);
}
function music(){
 var b=$("bm");
 function off(m){on=0;b.textContent="🎵 Musik: OFF";if(m)toast(m)}
 if(on){au.pause();return off()}
 if(!au){au=new Audio("lagu.mp3");au.loop=true;au.onerror=function(){off("lagu.mp3 tidak ditemukan")}}
 on=1;b.textContent="🎵 Musik: ON";var p=au.play();p&&p.catch(function(){off("Lagu gagal diputar")});
}
document.onclick=function(e){
 var el=e.target.closest("[data-a]");if(!el)return;
 var a=el.dataset.a,id=el.dataset.id,d=+el.dataset.d;
 if(a=="login"){$("pw").value="";M("ml",1)}
 else if(a=="go"){if($("pw").value==PASS){adm=true;try{localStorage.setItem("adm",1)}catch(x){}setAdm();draw();M("ml",0);toast("Login berhasil!")}else toast("Password salah! 🩸")}
 else if(a=="form")form(id);
 else if(a=="sv")sv();
 else if(a=="del")del();
 else if(a=="x")M(el.dataset.m,0);
 else if(a=="music")music();
 else if(a=="st"){C[id]=Math.max(0,(C[id]||0)+d);draw();if($("mc").classList.contains("s"))cart()}
 else if(a=="cart"){cart();M("mc",1)}
 else if(a=="clr"){C={};draw();cart()}
 else if(a=="order"){if(!tot()[0])return toast("Keranjang masih kosong!");M("mc",0);M("mw",1)}
 else if(a=="wa")wa(id);
};
try{adm=localStorage.getItem("adm")=="1"}catch(e){}
setAdm();
fetch(API+"/latest",{headers:{"X-Master-Key":KEY}})
.then(function(r){return r.json()})
.then(function(d){var r=d.record;P=r&&Array.isArray(r.data)?r.data:Array.isArray(r)?r:[]})
.catch(function(){P=[];toast("Database offline")})
.then(draw);
</script>
</body></html>
